name: Build and Publish Documentation

on:
  # Publish main-branch docs under the "main" version directory
  push:
    branches: [main]
    # Publish a tagged release under a directory named after the tag
    tags: ['*']

  # Manual trigger: optionally specify a ref to check out and/or a version
  # directory name. Useful for re-publishing a tag or fixing a broken deploy.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (branch, tag, or SHA). Defaults to the workflow ref.'
        required: false
        default: ''
      version:
        description: 'Version directory name (e.g. "0.0.5"). Defaults to tag name or "main".'
        required: false
        default: ''

# Pages deployment needs write access; contents write is needed to update the
# gh-pages persistence branch.
permissions:
  contents: write
  pages: write
  id-token: write

# Serialise deployments so that concurrent tag + main pushes don't race when
# reading/writing the gh-pages persistence branch.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}

    steps:
      - name: Determine version name
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Explicit override from workflow_dispatch input
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.ref }}" ]; then
            # Manual dispatch with a ref — strip refs/tags/ or refs/heads/ prefix
            REF="${{ inputs.ref }}"
            NAME="${REF#refs/tags/}"
            NAME="${NAME#refs/heads/}"
            echo "name=${NAME}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=main" >> $GITHUB_OUTPUT
          fi

  # The HammerspoonSDK's Swift API docs, built with DocC, which needs macOS and Xcode
  sdk-docs:
    runs-on: xcode-27
    needs: version
    permissions:
      contents: read
    outputs:
      built: ${{ steps.build.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Overlay doc-generation scripts from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build the SDK docs
        id: build
        run: |
          # Releases from before the SDK existed have no SDK docs
          if [ ! -d HammerspoonSDK/HammerspoonSDK.docc ]; then
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          scripts/sdk/build-docs.sh sdk-docs \
            "${{ github.event.repository.name }}/${{ needs.version.outputs.name }}/sdk"
          echo "built=true" >> $GITHUB_OUTPUT

      - name: Upload the SDK docs
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-docs
          path: sdk-docs
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: [version, sdk-docs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Overlay doc-generation scripts from main
        run: |
          # The target ref may be an older tag that predates certain scripts.
          # Always use scripts/, package.json, and package-lock.json from main
          # so we run the latest documentation tooling against any source version.
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/ package.json package-lock.json

      - name: Download the SDK docs
        if: needs.sdk-docs.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-docs
          path: sdk-docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs:generate

      - name: Fetch existing versioned site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site
          # Clone the gh-pages persistence branch if it exists so we keep all
          # previously published version directories.
          if git ls-remote --exit-code origin refs/heads/gh-pages 2>/dev/null; then
            git clone \
              --branch gh-pages \
              --single-branch \
              --depth 1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
              site-existing
            rsync -a --exclude='.git' site-existing/ site/
            rm -rf site-existing
          fi

      - name: Install new version docs into site
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          echo "Publishing docs as: $VERSION"
          rm -rf "site/$VERSION"
          mkdir -p "site/$VERSION"
          cp -r docs/js/html "site/$VERSION/js"
          cp -r docs/ts/html "site/$VERSION/ts"
          cp docs/hammerspoon.d.ts "site/$VERSION/hammerspoon.d.ts"
          cp docs/tsconfig.example.json "site/$VERSION/tsconfig.example.json"
          if [ -d sdk-docs ]; then
            cp -r sdk-docs "site/$VERSION/sdk"
          fi

      - name: Generate root version index
        run: node scripts/generate-versions-index.js site

      - name: Persist full site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a single orphan commit on gh-pages containing the complete
          # current site. Force-push keeps the branch lean (no history).
          #
          # scripts/release/release.sh pushes a signed appcast.xml to gh-pages
          # outside this workflow, possibly since the clone above. So take
          # appcast.xml from gh-pages as it is now, and only replace the
          # branch if it hasn't moved again since; otherwise go round again.
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          cd site
          git init
          git checkout --orphan gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            LEASE=""
            if git ls-remote --exit-code "$REMOTE" refs/heads/gh-pages > /dev/null; then
              git fetch --quiet --depth 1 "$REMOTE" refs/heads/gh-pages
              LEASE="$(git rev-parse FETCH_HEAD)"
              if git cat-file -e FETCH_HEAD:appcast.xml 2> /dev/null; then
                git show FETCH_HEAD:appcast.xml > appcast.xml
              fi
            fi
            git add -A
            if git rev-parse --quiet --verify HEAD > /dev/null; then
              git commit --quiet --amend --no-edit
            else
              git commit --quiet -m "docs: publish ${{ needs.version.outputs.name }}"
            fi
            if git push --force-with-lease="gh-pages:${LEASE}" "$REMOTE" gh-pages; then
              exit 0
            fi
            echo "gh-pages changed while publishing, retrying (attempt $attempt)"
            sleep 5
          done
          echo "::error::Couldn't update gh-pages: it kept changing"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
