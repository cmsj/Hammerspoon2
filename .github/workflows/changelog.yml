name: Changelog

# Checks the pull request's commits for Changelog-Added/Changed/Fixed trailers
# (see scripts/release/changelog.js), and comments to explain them if there
# are none or some are malformed. It never fails the PR.
#
# pull_request_target runs with the base branch's code and a token that can
# comment on PRs from forks. It must never check out, fetch, install or run
# anything from the PR: the commit messages come from the GitHub API, the
# scripts come from the base branch, and the comment escapes what it quotes
# from the commits. Actions are pinned to commit SHAs because they get the
# token.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entries
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Get pull request commits
        id: commits
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            // The API lists at most 250 of a pull request's commits.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            if (commits.length < pr.commits) {
              core.notice(`Only ${commits.length} of this pull request's ${pr.commits} commits can be listed, so its changelog entries weren't checked.`);
              core.setOutput('complete', 'false');
              return;
            }
            const records = commits.map(({ sha, commit }) => ({ sha, message: commit.message }));
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/commits.json`, JSON.stringify(records));
            core.setOutput('complete', 'true');

      - name: Check changelog trailers
        if: steps.commits.outputs.complete == 'true'
        run: |
          node scripts/release/changelog.js check --json --commits "$RUNNER_TEMP/commits.json" > "$RUNNER_TEMP/changelog.json"
          {
            echo "## Changelog entries"
            echo
            node scripts/release/changelog.js check --commits "$RUNNER_TEMP/commits.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: steps.commits.outputs.complete == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { changelogComment, MARKER } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release/changelog-comment.js`);
            const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/changelog.json`, 'utf8'));
            const pr = context.payload.pull_request;
            const { body, create } = changelogComment(result, pr.user.login);

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(MARKER));
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              }
            } else if (create) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
