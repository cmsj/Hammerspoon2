name: Test Suite

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: macos-26
    # Tests take ~13 min and the PR results summary can take ~10 more, so 30 was too tight.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode and macOS version
        run: |
          xcodebuild -version
          sw_vers

      - name: Setup Node.js for docs linter
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run documentation linter
        run: ./scripts/test-docs.sh

      - name: Generate documentation for app bundle
        run: npm run docs:generate

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -scheme Development

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme Development \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        env:
          # xcodebuild does NOT forward the job's own CI=true into the test host
          # process — only vars prefixed TEST_RUNNER_ are passed through (with the
          # prefix stripped). This is how HSUIWebViewTests.MemoryLeakTests detects CI
          # to skip the WebKit CVDisplayLink crash that's specific to this runner.
          TEST_RUNNER_CI: true
        run: |
          set -o pipefail && xcodebuild test \
            -scheme Development \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Publish test results to PR
        uses: slidoapp/xcresulttool@v3.1.1
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        # Only a PR summary; a slow or broken publish must not fail an otherwise green run.
        timeout-minutes: 15
        continue-on-error: true
        with:
          path: TestResults.xcresult
          show-passed-tests: false
          show-code-coverage: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: xcodebuild.log
          retention-days: 30

      # When the test host crashes, xcodebuild.log only says "Restarting after unexpected exit"
      # and blames whichever test happened to be running. The .ips crash report has the backtrace.
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
            -name 'Hammerspoon 2*.ips' -mmin -60 -exec cp {} crash-reports/ \; 2>/dev/null || true
          ls -la crash-reports

      - name: Upload crash reports and result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: |
            crash-reports/
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
